name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build API image
        run: docker build -f Dockerfile.api -t repopulse-api:ci .

      - name: Build Web image
        run: docker build -f Dockerfile.web -t repopulse-web:ci .

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
